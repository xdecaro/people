name: People 1.7.28 information maintenance contract

on:
  pull_request:
  push:
    branches:
      - main
      - feature/people-1.7.28-maintenance

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - name: Verify People 1.7.28 maintenance contract
        run: php tests/people-1.7.28-information-maintenance-contract.php
