name: People 1.7.25 three-row duplicate summary contract

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - name: Verify three-row duplicate summary
        run: php tests/people-1.7.25-duplicates-three-row-summary-contract.php
