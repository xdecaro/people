name: People 1.2.4 package

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - name: Validate People 1.2.4 source
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(tr -d '\r\n' < VERSION)"
          test "$VERSION" = '1.2.4'
          find component package tests -type f -name '*.php' -print0 | xargs -0 -n1 php -l
          python3 - <<'PY'
          import json, pathlib, xml.etree.ElementTree as ET
          for path in pathlib.Path('.').rglob('*.xml'):
              ET.parse(path)
          assets = json.load(open('component/media/joomla.asset.json', encoding='utf-8'))
          by_name = {item['name']: item for item in assets['assets']}
          assert by_name['com_xdecaropeople.admin']['uri'] == 'com_xdecaropeople/admin.css'
          assert by_name['com_xdecaropeople.person-form']['uri'] == 'com_xdecaropeople/person-form.js'

          root = ET.parse('component/admin/forms/person.xml').getroot()
          identity = root.find("./fieldset[@name='identity']")
          system = root.find("./fieldset[@name='system']")
          assert identity is not None and system is not None
          identity_names = [field.attrib.get('name') for field in identity.findall('field')]
          system_names = [field.attrib.get('name') for field in system.findall('field')]
          assert 'preferred_name' not in identity_names
          assert 'user_id' not in identity_names
          assert 'user_id' in system_names
          assert identity_names.index('nationality_codes') > identity_names.index('tax_identifier')
          PY
          grep -Fq '<version>1.2.4</version>' component/xdecaropeople.xml
          grep -Fq '<version>1.2.4</version>' package/pkg_xdecaropeople.xml
          grep -Fq '"version": "1.2.4"' component/media/joomla.asset.json
          grep -Fq "MINIMUM_CORE = '2.0.1'" component/admin/src/Service/CoreIntegrationService.php
          grep -Fq "MINIMUM_CORE='2.0.1'" package/script.php
          grep -Fq 'format="%d/%m/%Y" filter="raw" filterformat="d/m/Y"' component/admin/forms/person.xml
          grep -Fq '<fieldset name="disability" label="COM_XDECAROPEOPLE_FIELDSET_DISABILITY">' component/admin/forms/person.xml
          grep -Fq "dataset.xdecaroPeopleForm = '1.2.4'" component/media/js/person-form.js
          grep -Fq 'position:fixed' component/media/css/admin.css
          grep -Fq 'maxHeight' component/media/js/person-form.js
          grep -Fq 'document.body.appendChild(container)' component/media/js/person-form.js
          grep -Fq "useScript('com_xdecaropeople.person-form')" component/admin/src/View/Person/HtmlView.php
          ! grep -Rni 'profileCompleteness\|profile_completeness\|PROFILE_COMPLETENESS' component/admin/src component/admin/tmpl component/media/css/admin.css
          ! grep -Fq "people.profile_completeness" component/admin/src/Service/CoreIntegrationService.php
          grep -Fq 'WorldLocationService::fromJoomlaConfiguration()' component/admin/src/Controller/LocationController.php
          test -f component/admin/sql/updates/mysql/1.2.4.sql
          ! grep -RniE 'DROP[[:space:]]+TABLE|TRUNCATE[[:space:]]+TABLE' component/admin/sql
      - name: JavaScript syntax
        shell: bash
        run: node --check component/media/js/person-form.js
      - name: Build deterministic install packages
        shell: bash
        run: |
          set -euo pipefail
          chmod +x build/build.sh
          build/build.sh
          cp dist/SHA256SUMS.txt /tmp/people-sums
          build/build.sh
          diff -u /tmp/people-sums dist/SHA256SUMS.txt
          for zipfile in dist/*.zip; do unzip -t "$zipfile" >/dev/null; done
          unzip -Z1 dist/pkg_xdecaropeople_1.2.4.zip | grep -Fxq 'pkg_xdecaropeople.xml'
          unzip -Z1 dist/pkg_xdecaropeople_1.2.4.zip | grep -Fxq 'com_xdecaropeople.zip'
          unzip -p dist/pkg_xdecaropeople_1.2.4.zip com_xdecaropeople.zip > /tmp/component.zip
          unzip -p /tmp/component.zip media/joomla.asset.json | grep -Fq 'com_xdecaropeople/person-form.js'
          unzip -p /tmp/component.zip admin/forms/person.xml | grep -Fq '<fieldset name="disability"'
      - name: Upload People 1.2.4 install package
        uses: actions/upload-artifact@v4
        with:
          name: people-1.2.4-package
          path: |
            dist/pkg_xdecaropeople_1.2.4.zip
            dist/com_xdecaropeople_1.2.4.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7
