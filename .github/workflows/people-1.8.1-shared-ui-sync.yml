name: People 1.8.1 shared UI sync

on:
  push:
    branches:
      - feat/people-1.8.0-core-admin-ui
    paths:
      - .github/workflows/people-1.8.1-shared-ui-sync.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/people-1.8.0-core-admin-ui
      - name: Fix semantic KPI classes and labels
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('component/admin/tmpl/people/default.php')
          s = p.read_text()
          replacements = [
            ('<div class="card xdecaro-suite__metric">\n                <div class="card-body">\n                    <div class="small text-body-secondary mb-1"><?php echo Text::_(\'COM_XDECAROPEOPLE_PEOPLE\'); ?></div>', '<div class="card xdecaro-suite__metric is-primary">\n                <div class="card-body">\n                    <div class="small text-body-secondary mb-1"><?php echo Text::_(\'COM_XDECAROPEOPLE_KPI_TOTAL\'); ?></div>'),
            ('<div class="card xdecaro-suite__metric">\n                <div class="card-body">\n                    <div class="small text-body-secondary mb-1"><?php echo Text::_(\'JPUBLISHED\'); ?></div>', '<div class="card xdecaro-suite__metric is-success">\n                <div class="card-body">\n                    <div class="small text-body-secondary mb-1"><?php echo Text::_(\'COM_XDECAROPEOPLE_KPI_PUBLISHED\'); ?></div>'),
            ('<div class="card xdecaro-suite__metric">\n                <div class="card-body">\n                    <div class="small text-body-secondary mb-1"><?php echo Text::_(\'JUNPUBLISHED\'); ?></div>', '<div class="card xdecaro-suite__metric is-neutral">\n                <div class="card-body">\n                    <div class="small text-body-secondary mb-1"><?php echo Text::_(\'COM_XDECAROPEOPLE_KPI_UNPUBLISHED\'); ?></div>'),
            ('<div class="card xdecaro-suite__metric">\n                <div class="card-body">\n                    <div class="small text-body-secondary mb-1"><?php echo Text::_(\'COM_XDECAROPEOPLE_FILTER_TRASHED\'); ?></div>', '<div class="card xdecaro-suite__metric is-danger">\n                <div class="card-body">\n                    <div class="small text-body-secondary mb-1"><?php echo Text::_(\'COM_XDECAROPEOPLE_KPI_TRASHED\'); ?></div>'),
            ("Text::_('COM_XDECAROPEOPLE_DUPLICATES'); ?></div>\n                    <strong class=\"fs-3\"><?php echo (int) $this->duplicateGroups; ?></strong>", "Text::_('COM_XDECAROPEOPLE_KPI_DUPLICATES'); ?></div>\n                    <strong class=\"fs-3\"><?php echo (int) $this->duplicateGroups; ?></strong>"),
          ]
          for old, new in replacements:
              if old not in s:
                  raise SystemExit('Expected People KPI fragment not found: ' + old[:80])
              s = s.replace(old, new, 1)
          p.write_text(s)
          PY
      - name: Commit corrected KPI mapping
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add component/admin/tmpl/people/default.php
          git diff --cached --quiet && exit 0
          git commit -m "fix: map People KPIs to shared Core variants"
          git push origin HEAD:feat/people-1.8.0-core-admin-ui
