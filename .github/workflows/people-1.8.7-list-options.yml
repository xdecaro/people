name: People 1.8.7 list options

on:
  pull_request:
  push:
    branches:
      - main
      - feat/people-1.8.0-core-admin-ui

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - run: php tests/people-1.8.7-list-options-contract.php
