name: People Organizations history tab contract

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - name: PHP syntax
        run: php -l tests/organizations-history-tab-contract.php
      - name: Organizations history tab contract
        run: php tests/organizations-history-tab-contract.php
