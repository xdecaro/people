name: People Notifications runtime

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integration:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
          MYSQL_DATABASE: joomla
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: 'mysqli, zip, simplexml'
          coverage: none
      - name: Build People 1.2.16
        run: chmod +x build/build.sh && build/build.sh
      - name: Build Core 2.0.1
        shell: bash
        run: |
          set -euo pipefail
          CORE_SHA='423d1cb0bf0a4cedf165295e03050f5a886bbcd3'
          git clone --quiet https://github.com/xdecaro/core.git /tmp/core-src
          git -C /tmp/core-src checkout --quiet "$CORE_SHA"
          test "$(tr -d '\r\n' < /tmp/core-src/VERSION)" = '2.0.1'
          python3 /tmp/core-src/build/build.py
          cp /tmp/core-src/dist/pkg_xdecarocore_2.0.1.zip /tmp/core.zip
      - name: Download Joomla 6.1.3 and Notifications 1.1.1
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 'https://github.com/joomla/joomla-cms/releases/download/6.1.3/Joomla_6.1.3-Stable-Full_Package.zip' -o /tmp/joomla.zip
          echo 'a49305652503f9344d046d55471f324a07882996132ed967c3b0fe34707ae4a1  /tmp/joomla.zip' | sha256sum --check --strict
          curl -fL --retry 3 'https://github.com/xdecaro/notifications/releases/download/v1.1.1/pkg_xdecaronotifications_1.1.1.zip' -o /tmp/notifications.zip
          echo 'c4b231840fecfe6f072b38689ed402e309f3e804170956584663ebee8b58e8b1  /tmp/notifications.zip' | sha256sum --check --strict
          mkdir joomla
          unzip -q /tmp/joomla.zip -d joomla
      - name: Install integration stack
        shell: bash
        run: |
          set -euo pipefail
          cd joomla
          php installation/joomla.php install \
            --site-name='People Notifications CI' \
            --admin-user='Integration Admin' \
            --admin-username=admin \
            --admin-password="PeopleNotifications-${GITHUB_RUN_ID}!" \
            --admin-email=admin@example.invalid \
            --db-type=mysqli \
            --db-host=127.0.0.1 \
            --db-user=root \
            --db-pass='' \
            --db-name=joomla \
            --db-prefix=ppl_ \
            --db-encryption=0 \
            --no-interaction
          php cli/joomla.php extension:install --path=/tmp/core.zip -vvv
          php cli/joomla.php extension:install --path=/tmp/notifications.zip -vvv
          php cli/joomla.php extension:install --path="$GITHUB_WORKSPACE/dist/pkg_xdecaropeople_1.2.16.zip" -vvv
      - name: Verify People publishes through Notifications public services
        shell: bash
        run: |
          set -euo pipefail
          cd joomla
          cat > people-notifications-probe.php <<'PHP'
          <?php
          $_SERVER['HTTP_HOST'] = 'localhost';
          define('_JEXEC', 1);
          define('JPATH_BASE', __DIR__);
          require JPATH_BASE . '/includes/defines.php';
          require JPATH_BASE . '/includes/framework.php';

          $container = \Joomla\CMS\Factory::getContainer();
          $container->alias('session', 'session.cli')
              ->alias('JSession', 'session.cli')
              ->alias(\Joomla\CMS\Session\Session::class, 'session.cli')
              ->alias(\Joomla\Session\Session::class, 'session.cli')
              ->alias(\Joomla\Session\SessionInterface::class, 'session.cli');
          $app = $container->get('JApplicationAdministrator');
          \Joomla\CMS\Factory::$application = $app;
          $app->createExtensionNamespaceMap();
          $db = $container->get(\Joomla\Database\DatabaseInterface::class);

          $query = $db->getQuery(true)
              ->select($db->quoteName('id'))
              ->from($db->quoteName('#__users'))
              ->where($db->quoteName('username') . ' = ' . $db->quote('admin'));
          $adminId = (int) $db->setQuery($query, 0, 1)->loadResult();
          $userFactory = $container->get(\Joomla\CMS\User\UserFactoryInterface::class);
          $app->loadIdentity($userFactory->loadUserById($adminId));

          $query = $db->getQuery(true)
              ->select([$db->quoteName('extension_id'), $db->quoteName('params')])
              ->from($db->quoteName('#__extensions'))
              ->where($db->quoteName('type') . ' = ' . $db->quote('component'))
              ->where($db->quoteName('element') . ' = ' . $db->quote('com_xdecaropeople'));
          $extension = $db->setQuery($query, 0, 1)->loadAssoc();
          $params = json_decode((string) ($extension['params'] ?? '{}'), true) ?: [];
          $params['notification_recipient_user_id'] = $adminId;
          $record = (object) [
              'extension_id' => (int) $extension['extension_id'],
              'params' => json_encode($params, JSON_UNESCAPED_SLASHES | JSON_UNESCAPED_UNICODE),
          ];
          $db->updateObject('#__extensions', $record, 'extension_id');

          $person = (object) [
              'uuid' => 'aaaaaaaa-bbbb-4ccc-8ddd-eeeeeeeeeeee',
              'display_name' => 'Runtime Notification Person',
              'first_name' => 'Runtime',
              'last_name' => 'Notification Person',
              'tax_identifier' => 'PRIVATE-RUNTIME-TIN',
              'state' => 1,
              'access' => 1,
              'created' => \Joomla\CMS\Factory::getDate()->toSql(),
              'created_by' => $adminId,
          ];
          $db->insertObject('#__xdecaropeople_people', $person, 'id');
          $personId = (int) $person->id;

          $people = $app->bootComponent('com_xdecaropeople');
          $service = $people->getNotificationIntegrationService();
          $snapshot = $service->snapshot($personId);
          if (!$snapshot) {
              fwrite(STDERR, "People notification snapshot failed.\n");
              exit(1);
          }
          $service->notifyPersonCreated($snapshot);

          $query = $db->getQuery(true)
              ->select('*')
              ->from($db->quoteName('#__xdecaronotifications_items'))
              ->where($db->quoteName('source_component') . ' = ' . $db->quote('com_xdecaropeople'))
              ->where($db->quoteName('source_entity') . ' = ' . $db->quote('person'))
              ->where($db->quoteName('source_id') . ' = ' . $db->quote((string) $personId));
          $notification = $db->setQuery($query, 0, 1)->loadAssoc();
          if (!$notification) {
              fwrite(STDERR, "People did not create a Notifications item.\n");
              exit(1);
          }
          if (($notification['recipient_type'] ?? '') !== 'user' || (int) ($notification['recipient_id'] ?? 0) !== $adminId) {
              fwrite(STDERR, "People notification recipient is incorrect.\n");
              exit(1);
          }
          if (str_contains((string) ($notification['message'] ?? ''), 'PRIVATE-RUNTIME-TIN')) {
              fwrite(STDERR, "Sensitive People data leaked into notification text.\n");
              exit(1);
          }

          $notificationId = (int) $notification['id'];
          $query = $db->getQuery(true)
              ->select('COUNT(*)')
              ->from($db->quoteName('#__xdecaronotifications_deliveries'))
              ->where($db->quoteName('notification_id') . ' = ' . $notificationId)
              ->where($db->quoteName('channel') . ' = ' . $db->quote('in_app'));
          if ((int) $db->setQuery($query)->loadResult() !== 1) {
              fwrite(STDERR, "People did not queue the in_app delivery.\n");
              exit(1);
          }

          echo "People → Notifications Joomla 6.1.3 runtime integration OK\n";
          PHP
          php people-notifications-probe.php
