name: People 1.3.1 canonical package and identity details

on:
  pull_request:
    paths:
      - 'VERSION'
      - 'package/**'
      - 'updates/**'
      - 'build/**'
      - 'component/admin/access.xml'
      - 'component/admin/src/Service/PersonProviderService.php'
      - 'component/admin/language/**'
      - 'tests/people-1.3.1-canonical-package-identity-contract.php'
      - '.github/workflows/people-1.3.1-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - name: People 1.3.1 contract
        run: php tests/people-1.3.1-canonical-package-identity-contract.php
