name: People batch provider contract

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - name: Batch provider contract
        run: php tests/person-provider-batch.php
      - name: People 1.2.15 release contract
        run: php tests/people-1.2.15-contract.php
