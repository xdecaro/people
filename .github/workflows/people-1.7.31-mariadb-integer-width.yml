name: People 1.7.31 MariaDB integer width

on:
  pull_request:
  push:
    branches:
      - people-1.7.31-normalize-mariadb-integer-widths

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - name: MariaDB integer-width regression contract
        run: |
          set -euo pipefail
          php tests/people-1.7.31-mariadb-integer-width-contract.php
