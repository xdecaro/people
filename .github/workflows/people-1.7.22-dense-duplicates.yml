name: People 1.7.22 dense duplicate rows

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - name: Dense duplicate row contract
        run: php tests/people-1.7.22-duplicate-dense-rows-contract.php
