name: People package

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - name: Read current version
        id: version
        shell: bash
        run: echo "version=$(tr -d '\r\n' < VERSION)" >> "$GITHUB_OUTPUT"
      - name: Validate current People source
        shell: bash
        run: |
          set -euo pipefail
          V="${{ steps.version.outputs.version }}"
          find component package tests -type f -name '*.php' -print0 | xargs -0 -n1 php -l
          php tests/core-integration-smoke.php
          php tests/person-validation-summary-contract.php
          php tests/person-input-ui-contract.php
          php tests/relation-reciprocity.php
          php tests/people-1.2.14-contract.php
          php tests/person-provider-batch.php
          php tests/person-provider-sensitive-contract.php
          php tests/people-1.2.15-contract.php
          php tests/people-notifications-contract.php
          php tests/people-1.2.16-contract.php
          php tests/competitions-history-tab-contract.php
          php tests/people-1.3.1-canonical-package-identity-contract.php
          php tests/organizations-history-tab-contract.php
          php tests/people-1.4.0-contract.php
          php tests/people-1.5.0-membership-contract.php
          php tests/people-1.6.0-import-contract.php
          php tests/people-1.6.1-import-review-contract.php
          php tests/people-1.7.0-duplicate-resolution-contract.php
          php tests/people-1.7.1-duplicate-accordion-contract.php
          php tests/people-1.7.3-import-duplicate-rows-contract.php
          python3 - "$V" <<'PY'
          import json, pathlib, sys, xml.etree.ElementTree as ET
          version = sys.argv[1]
          for path in pathlib.Path('.').rglob('*.xml'):
              ET.parse(path)
          component = ET.parse('component/xdecaropeople.xml').getroot()
          package = ET.parse('package/pkg_people.xml').getroot()
          assets = json.load(open('component/media/joomla.asset.json', encoding='utf-8'))
          assert component.findtext('version') == version
          assert package.findtext('version') == version
          assert package.findtext('packagename') == 'people'
          assert component.find('targetplatform').attrib['version'] == '6.1.3'
          assert package.find('targetplatform').attrib['version'] == '6.1.3'
          assert assets['version'] == version
          assert all(item.get('version') == version for item in assets.get('assets', []))
          PY
          node --check component/media/js/person-form.js
          node --check component/media/js/person-cancel-fix.js
          node --check component/media/js/import.js
          ! grep -RniE 'DROP[[:space:]]+TABLE|TRUNCATE[[:space:]]+TABLE' component/admin/sql
          ! grep -Rni '#__xdecaroorganizations_' component
          ! grep -Rni '#__decaromembership_' component
          test -f "component/admin/sql/updates/mysql/${V}.sql"
      - name: Build deterministic install packages
        shell: bash
        run: |
          set -euo pipefail
          V="${{ steps.version.outputs.version }}"
          chmod +x build/build.sh
          build/build.sh
          cp dist/SHA256SUMS.txt /tmp/people-sums
          build/build.sh
          diff -u /tmp/people-sums dist/SHA256SUMS.txt
          for zipfile in dist/*.zip; do unzip -t "$zipfile" >/dev/null; done
          unzip -Z1 "dist/pkg_people_${V}.zip" | grep -Fxq 'pkg_people.xml'
          unzip -Z1 "dist/pkg_people_${V}.zip" | grep -Fxq 'com_xdecaropeople.zip'
          unzip -p "dist/pkg_people_${V}.zip" com_xdecaropeople.zip > /tmp/component.zip
          unzip -p /tmp/component.zip admin/src/Service/PersonProviderService.php | grep -Fq 'function getPeopleByUuids('
          unzip -p /tmp/component.zip admin/src/Service/PersonProviderService.php | grep -Fq 'function searchPeopleForIdentity('
          unzip -p /tmp/component.zip admin/src/Service/PersonProviderService.php | grep -Fq 'function getRelations('
          unzip -p /tmp/component.zip admin/src/Service/PersonProviderService.php | grep -Fq 'function getCurrentAddress('
          unzip -p /tmp/component.zip admin/src/Service/CompetitionsIntegrationService.php | grep -Fq 'getPersonHistory'
          unzip -p /tmp/component.zip admin/src/Service/OrganizationsIntegrationService.php | grep -Fq 'organizations.people_appointments'
          unzip -p /tmp/component.zip admin/src/Service/MembershipIntegrationService.php | grep -Fq 'membership.person_memberships'
          unzip -p /tmp/component.zip admin/src/Service/ImportService.php | grep -Fq 'function importBatch'
          unzip -p /tmp/component.zip admin/src/Service/DuplicateService.php | grep -Fq 'function mergeGroup'
          unzip -p /tmp/component.zip admin/src/Controller/DuplicateController.php | grep -Fq 'function dismiss'
          unzip -p /tmp/component.zip admin/src/Service/PersonProviderService.php | grep -Fq 'resolveCanonicalUuid'
          unzip -Z1 /tmp/component.zip | grep -Fxq 'admin/sql/updates/mysql/1.7.0.sql'
          unzip -Z1 /tmp/component.zip | grep -Fxq 'admin/sql/updates/mysql/1.7.1.sql'
          unzip -Z1 /tmp/component.zip | grep -Fxq 'admin/sql/updates/mysql/1.7.2.sql'
          unzip -Z1 /tmp/component.zip | grep -Fxq 'admin/sql/updates/mysql/1.7.3.sql'
          unzip -Z1 /tmp/component.zip | grep -Fxq 'media/js/import.js'
          unzip -Z1 /tmp/component.zip | grep -Fxq 'admin/language/it-IT/com_xdecaropeople_organizations.ini'
          unzip -Z1 /tmp/component.zip | grep -Fxq 'admin/language/en-GB/com_xdecaropeople_organizations.ini'
      - name: Upload current People install package
        uses: actions/upload-artifact@v4
        with:
          name: people-package
          path: |
            dist/pkg_people_*.zip
            dist/com_xdecaropeople_*.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7
