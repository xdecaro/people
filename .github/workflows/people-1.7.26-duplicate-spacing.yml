name: People 1.7.26 duplicate spacing contract

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - name: Verify duplicate row spacing
        run: php tests/people-1.7.26-duplicates-spacing-contract.php
