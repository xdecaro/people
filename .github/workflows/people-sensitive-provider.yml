name: People sensitive provider

on:
  pull_request:
  push:
    branches: [main]

permissions: {contents: read}

jobs:
  sensitive-provider:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - name: Sensitive provider contract
        run: php tests/person-provider-sensitive-contract.php
