name: Release People

on:
  push:
    branches: [main]
    paths: [VERSION]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: shivammathur/setup-php@v2
        with: {php-version: '8.3', coverage: none}
      - name: Validate stable source
        shell: bash
        run: |
          set -euo pipefail
          V="$(tr -d '\r\n' < VERSION)"
          find component package tests -type f -name '*.php' -print0 | xargs -0 -n1 php -l
          php tests/core-integration-smoke.php
          php tests/person-validation-summary-contract.php
          php tests/person-input-ui-contract.php
          php tests/relation-reciprocity.php
          php tests/people-1.2.14-contract.php
          php tests/person-provider-batch.php
          php tests/person-provider-sensitive-contract.php
          php tests/people-1.2.15-contract.php
          php tests/people-notifications-contract.php
          php tests/people-1.2.16-contract.php
          php tests/competitions-history-tab-contract.php
          php tests/people-1.3.1-canonical-package-identity-contract.php
          php tests/organizations-history-tab-contract.php
          php tests/people-1.4.0-contract.php
          php tests/people-1.5.0-membership-contract.php
          python3 - "$V" <<'PY'
          import json, pathlib, sys, xml.etree.ElementTree as ET
          v=sys.argv[1]
          for p in pathlib.Path('.').rglob('*.xml'): ET.parse(p)
          c=ET.parse('component/xdecaropeople.xml').getroot(); p=ET.parse('package/pkg_people.xml').getroot(); a=json.load(open('component/media/joomla.asset.json'))
          assert c.findtext('version')==v and p.findtext('version')==v and p.findtext('packagename')=='people'
          assert a['version']==v and all(x.get('version')==v for x in a.get('assets',[]))
          PY
          node --check component/media/js/person-form.js
          node --check component/media/js/person-cancel-fix.js
          ! grep -RniE 'DROP[[:space:]]+TABLE|TRUNCATE[[:space:]]+TABLE' component/admin/sql
          ! grep -Rni '#__xdecaroorganizations_' component
          ! grep -Rni '#__decaromembership_' component
      - name: Build deterministic release
        shell: bash
        run: |
          set -euo pipefail
          V="$(tr -d '\r\n' < VERSION)"; chmod +x build/build.sh; build/build.sh; cp dist/SHA256SUMS.txt /tmp/sums; build/build.sh; diff -u /tmp/sums dist/SHA256SUMS.txt
          unzip -t "dist/com_xdecaropeople_${V}.zip" >/dev/null
          unzip -t "dist/pkg_people_${V}.zip" >/dev/null
          unzip -p "dist/pkg_people_${V}.zip" com_xdecaropeople.zip > /tmp/component.zip
          unzip -p /tmp/component.zip admin/src/Service/PersonProviderService.php | grep -Fq 'function searchPeopleForIdentity('
          unzip -p /tmp/component.zip admin/src/Service/PersonProviderService.php | grep -Fq 'function getRelations('
          unzip -p /tmp/component.zip admin/src/Service/PersonProviderService.php | grep -Fq 'function getCurrentAddress('
          unzip -p /tmp/component.zip admin/src/Service/OrganizationsIntegrationService.php | grep -Fq 'organizations.people_appointments'
          unzip -p /tmp/component.zip admin/src/Service/MembershipIntegrationService.php | grep -Fq 'membership.person_memberships'
          unzip -Z1 /tmp/component.zip | grep -Fxq 'admin/language/it-IT/com_xdecaropeople_organizations.ini'
          unzip -Z1 /tmp/component.zip | grep -Fxq 'admin/language/en-GB/com_xdecaropeople_organizations.ini'
      - name: Refuse existing release
        env: {GH_TOKEN: '${{ secrets.GITHUB_TOKEN }}'}
        run: |
          V="$(tr -d '\r\n' < VERSION)"; if gh release view "v${V}" >/dev/null 2>&1; then echo "Release v${V} already exists." >&2; exit 1; fi
      - name: Publish release
        env: {GH_TOKEN: '${{ secrets.GITHUB_TOKEN }}'}
        shell: bash
        run: |
          set -euo pipefail
          V="$(tr -d '\r\n' < VERSION)"
          gh release create "v${V}" "dist/com_xdecaropeople_${V}.zip" "dist/pkg_people_${V}.zip" dist/SHA256SUMS.txt \
            --title "People ${V}" \
            --notes "People ${V}: adds optional read-only Membership integration through the public membership.person_memberships capability and refines duplicate contact signals. Existing person relationships, Organizations and Competitions integrations remain independent. Joomla 6.1.3 only."
      - name: Publish canonical and legacy-bridge Joomla update feeds
        shell: bash
        run: |
          set -euo pipefail
          V="$(tr -d '\r\n' < VERSION)"; SHA="$(sha256sum "dist/pkg_people_${V}.zip" | awk '{print $1}')"
          python3 - "$V" "$SHA" <<'PY'
          import sys, xml.etree.ElementTree as ET
          v,sha=sys.argv[1:3]
          url=f'https://github.com/xdecaro/people/releases/download/v{v}/pkg_people_{v}.zip'
          for path, element in [
              ('updates/pkg_people.xml', 'pkg_people'),
              ('updates/pkg_xdecaropeople.xml', 'pkg_xdecaropeople'),
          ]:
              t=ET.parse(path); u=t.getroot().find('./update')
              u.find('name').text='People'; u.find('element').text=element; u.find('version').text=v
              u.find('./downloads/downloadurl').text=url; u.find('sha256').text=sha
              u.find('targetplatform').set('version',r'6\.1\.3$'); u.find('php_minimum').text='8.3.0'
              ET.indent(t,space='  '); t.write(path,encoding='utf-8',xml_declaration=True)
          PY
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add updates/pkg_people.xml updates/pkg_xdecaropeople.xml
          git diff --cached --quiet || git commit -m "Publish update feeds for People ${V}"
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Verify published updater resources
        shell: bash
        run: |
          set -euo pipefail
          V="$(tr -d '\r\n' < VERSION)"; EXPECTED_SHA="$(sha256sum "dist/pkg_people_${V}.zip" | awk '{print $1}')"
          for FEED in pkg_people pkg_xdecaropeople; do
            for attempt in 1 2 3 4 5; do
              curl -fsSL "https://raw.githubusercontent.com/xdecaro/people/main/updates/${FEED}.xml?run=${GITHUB_RUN_ID}-${attempt}" -o "/tmp/${FEED}.xml" || true
              if grep -Fq "<version>${V}</version>" "/tmp/${FEED}.xml" 2>/dev/null; then break; fi
              sleep 3
            done
            grep -Fq "releases/download/v${V}/pkg_people_${V}.zip" "/tmp/${FEED}.xml"
            grep -Fq "<sha256>${EXPECTED_SHA}</sha256>" "/tmp/${FEED}.xml"
          done
          grep -Fq '<element>pkg_people</element>' /tmp/pkg_people.xml
          grep -Fq '<element>pkg_xdecaropeople</element>' /tmp/pkg_xdecaropeople.xml
          curl -fL --retry 3 "https://github.com/xdecaro/people/releases/download/v${V}/pkg_people_${V}.zip" -o /tmp/published-package.zip
          echo "${EXPECTED_SHA}  /tmp/published-package.zip" | sha256sum --check --strict
          unzip -t /tmp/published-package.zip >/dev/null
