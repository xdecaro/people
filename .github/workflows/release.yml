name: Release People

on:
  push:
    branches: [main]
    paths: [VERSION]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - name: Validate stable source
        shell: bash
        run: |
          set -euo pipefail
          V="$(tr -d '\r\n' < VERSION)"
          find component package tests -type f -name '*.php' -print0 | xargs -0 -n1 php -l
          php tests/core-integration-smoke.php
          php tests/person-validation-summary-contract.php
          php tests/person-input-ui-contract.php
          php tests/relation-reciprocity.php
          if [ -f tests/people-1.2.14-contract.php ]; then php tests/people-1.2.14-contract.php; fi
          if [ -f tests/person-provider-batch.php ]; then php tests/person-provider-batch.php; fi
          if [ -f tests/people-1.2.15-contract.php ]; then php tests/people-1.2.15-contract.php; fi
          python3 - "$V" <<'PY'
          import json, pathlib, sys, xml.etree.ElementTree as ET
          version = sys.argv[1]
          for path in pathlib.Path('.').rglob('*.xml'):
              ET.parse(path)
          assert ET.parse('component/xdecaropeople.xml').getroot().findtext('version') == version
          assert ET.parse('package/pkg_xdecaropeople.xml').getroot().findtext('version') == version
          assets = json.load(open('component/media/joomla.asset.json', encoding='utf-8'))
          assert assets['version'] == version
          assert all(item.get('version') == version for item in assets.get('assets', []))
          PY
          node --check component/media/js/person-form.js
          node --check component/media/js/person-cancel-fix.js
          ! grep -RniE 'DROP[[:space:]]+TABLE|TRUNCATE[[:space:]]+TABLE' component/admin/sql
      - name: Build deterministic release
        shell: bash
        run: |
          set -euo pipefail
          V="$(tr -d '\r\n' < VERSION)"
          chmod +x build/build.sh
          build/build.sh
          cp dist/SHA256SUMS.txt /tmp/sums
          build/build.sh
          diff -u /tmp/sums dist/SHA256SUMS.txt
          unzip -t "dist/com_xdecaropeople_${V}.zip" >/dev/null
          unzip -t "dist/pkg_xdecaropeople_${V}.zip" >/dev/null
          unzip -p "dist/pkg_xdecaropeople_${V}.zip" com_xdecaropeople.zip > /tmp/component.zip
          unzip -p /tmp/component.zip admin/src/Service/PersonProviderService.php | grep -Fq 'function getPeopleByUuids('
      - name: Refuse existing release
        env:
          GH_TOKEN: '${{ secrets.GITHUB_TOKEN }}'
        run: |
          V="$(tr -d '\r\n' < VERSION)"
          if gh release view "v${V}" >/dev/null 2>&1; then
            echo "Release v${V} already exists." >&2
            exit 1
          fi
      - name: Publish release
        env:
          GH_TOKEN: '${{ secrets.GITHUB_TOKEN }}'
        shell: bash
        run: |
          set -euo pipefail
          V="$(tr -d '\r\n' < VERSION)"
          gh release create "v${V}" \
            "dist/com_xdecaropeople_${V}.zip" \
            "dist/pkg_xdecaropeople_${V}.zip" \
            dist/SHA256SUMS.txt \
            --title "People ${V}" \
            --notes "People ${V}: stable Joomla 6 release for the xdecaro ecosystem. Adds the public batch person-provider contract used by Membership while preserving the validated 1.2.14 profile, reciprocal relations, responsive administration UI and duplicate-review workflow."
      - name: Publish Joomla update feed
        shell: bash
        run: |
          set -euo pipefail
          V="$(tr -d '\r\n' < VERSION)"
          SHA="$(sha256sum "dist/pkg_xdecaropeople_${V}.zip" | awk '{print $1}')"
          python3 - "$V" "$SHA" <<'PY'
          import sys, xml.etree.ElementTree as ET
          version, sha = sys.argv[1:3]
          path = 'updates/pkg_xdecaropeople.xml'
          tree = ET.parse(path)
          update = tree.getroot().find('./update')
          update.find('name').text = 'People'
          update.find('version').text = version
          update.find('./downloads/downloadurl').text = f'https://github.com/xdecaro/people/releases/download/v{version}/pkg_xdecaropeople_{version}.zip'
          update.find('sha256').text = sha
          ET.indent(tree, space='  ')
          tree.write(path, encoding='utf-8', xml_declaration=True)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add updates/pkg_xdecaropeople.xml
          git diff --cached --quiet || git commit -m "Publish update feed for People ${V}"
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Verify published updater resources
        shell: bash
        run: |
          set -euo pipefail
          V="$(tr -d '\r\n' < VERSION)"
          EXPECTED_SHA="$(sha256sum "dist/pkg_xdecaropeople_${V}.zip" | awk '{print $1}')"
          for attempt in 1 2 3 4 5; do
            curl -fsSL "https://raw.githubusercontent.com/xdecaro/people/main/updates/pkg_xdecaropeople.xml?run=${GITHUB_RUN_ID}-${attempt}" -o /tmp/feed.xml || true
            if grep -Fq "<version>${V}</version>" /tmp/feed.xml 2>/dev/null; then break; fi
            sleep 3
          done
          grep -Fq "<version>${V}</version>" /tmp/feed.xml
          grep -Fq "releases/download/v${V}/pkg_xdecaropeople_${V}.zip" /tmp/feed.xml
          grep -Fq "<sha256>${EXPECTED_SHA}</sha256>" /tmp/feed.xml
          curl -fL --retry 3 "https://github.com/xdecaro/people/releases/download/v${V}/pkg_xdecaropeople_${V}.zip" -o /tmp/published-package.zip
          echo "${EXPECTED_SHA}  /tmp/published-package.zip" | sha256sum --check --strict
          unzip -t /tmp/published-package.zip >/dev/null
