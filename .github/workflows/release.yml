name: Release People
on:
  push:
    branches: [main]
    paths: [VERSION]
permissions: {contents: write}
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: shivammathur/setup-php@v2
        with: {php-version: '8.3', coverage: none}
      - name: Build stable release
        shell: bash
        run: |
          set -euo pipefail
          V="$(tr -d '\r\n' < VERSION)"
          find component package tests -type f -name '*.php' -print0 | xargs -0 -n1 php -l
          php tests/core-integration-smoke.php
          test -f "component/admin/sql/updates/mysql/${V}.sql"
          grep -Fq "<version>${V}</version>" component/xdecaropeople.xml
          grep -Fq "<version>${V}</version>" package/pkg_xdecaropeople.xml
          chmod +x build/build.sh
          build/build.sh
          cp dist/SHA256SUMS.txt /tmp/sums
          build/build.sh
          diff -u /tmp/sums dist/SHA256SUMS.txt
      - name: Refuse existing release
        env: {GH_TOKEN: '${{ secrets.GITHUB_TOKEN }}'}
        run: if gh release view "v$(cat VERSION)" >/dev/null 2>&1; then exit 1; fi
      - name: Publish release
        env: {GH_TOKEN: '${{ secrets.GITHUB_TOKEN }}'}
        run: |
          V="$(tr -d '\r\n' < VERSION)"
          gh release create "v${V}" dist/com_xdecaropeople_${V}.zip dist/pkg_xdecaropeople_${V}.zip dist/SHA256SUMS.txt --title "People ${V}" --notes "People ${V}: Joomla 6-only stable release for the xdecaro ecosystem. See the repository README and pull request for the exact patch scope."
      - name: Publish update feed
        shell: bash
        run: |
          set -euo pipefail
          V="$(tr -d '\r\n' < VERSION)"
          SHA="$(sha256sum "dist/pkg_xdecaropeople_${V}.zip" | awk '{print $1}')"
          python3 - "$V" "$SHA" <<'PY'
          import sys, xml.etree.ElementTree as ET
          version, sha = sys.argv[1:3]
          p = 'updates/pkg_xdecaropeople.xml'
          t = ET.parse(p)
          update = t.getroot().find('./update')
          update.find('name').text = 'People'
          update.find('version').text = version
          update.find('./downloads/downloadurl').text = f'https://github.com/xdecaro/people/releases/download/v{version}/pkg_xdecaropeople_{version}.zip'
          update.find('sha256').text = sha
          ET.indent(t, space='  ')
          t.write(p, encoding='utf-8', xml_declaration=True)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add updates/pkg_xdecaropeople.xml
          git diff --cached --quiet || git commit -m "Publish update feed for People ${V}"
          git pull --rebase origin main
          git push origin HEAD:main
