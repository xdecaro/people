name: People 1.8.0 CI Core migration

on:
  push:
    branches:
      - feat/people-1.8.0-core-admin-ui
    paths:
      - .github/workflows/people-1.8.0-ci-core-migrate.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/people-1.8.0-core-admin-ui
      - name: Align People CI with Core 2.2.0
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/build.yml')
          s = p.read_text()
          s = s.replace("MINIMUM_CORE = '2.0.1'", "MINIMUM_CORE = '2.2.0'")
          s = s.replace('Build pinned Core 2.0.1 dependency', 'Build pinned Core 2.2.0 dependency')
          s = s.replace("CORE_SHA='423d1cb0bf0a4cedf165295e03050f5a886bbcd3'", "CORE_SHA='dd133da8a2b84e7b050b0afc5c53947971755849'")
          s = s.replace("= '2.0.1'", "= '2.2.0'")
          s = s.replace('pkg_xdecarocore_2.0.1.zip', 'pkg_core_2.2.0.zip')
          p.write_text(s)
          PY
      - name: Commit CI migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/build.yml
          git diff --cached --quiet && exit 0
          git commit -m "ci: validate People 1.8.0 against Core 2.2.0"
          git push origin HEAD:feat/people-1.8.0-core-admin-ui
