name: People CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - name: PHP syntax
        run: find component package tests -type f -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Current People contracts
        shell: bash
        run: |
          set -euo pipefail
          php tests/core-integration-smoke.php
          php tests/person-validation-summary-contract.php
          php tests/person-input-ui-contract.php
          php tests/relation-reciprocity.php
          php tests/people-1.2.14-contract.php
          php tests/person-provider-batch.php
          php tests/people-1.2.15-contract.php
          php tests/people-notifications-contract.php
          php tests/people-1.2.16-contract.php
      - name: Validate source metadata
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(tr -d '\r\n' < VERSION)"
          python3 - "$VERSION" <<'PY'
          import json, pathlib, sys, xml.etree.ElementTree as ET
          version = sys.argv[1]
          for path in pathlib.Path('.').rglob('*.xml'):
              ET.parse(path)
          component = ET.parse('component/xdecaropeople.xml').getroot()
          package = ET.parse('package/pkg_xdecaropeople.xml').getroot()
          feed = ET.parse('updates/pkg_xdecaropeople.xml').getroot().find('./update')
          assets = json.load(open('component/media/joomla.asset.json', encoding='utf-8'))
          assert component.findtext('version') == version
          assert package.findtext('version') == version
          assert assets['version'] == version
          assert component.find('targetplatform').attrib['version'] == '6.1.3'
          assert package.find('targetplatform').attrib['version'] == '6.1.3'
          assert feed is not None
          assert feed.find('targetplatform').attrib['version'] == r'6\.1\.3$'
          assert feed.findtext('php_minimum') == '8.3.0'
          feed_version = feed.findtext('version') or ''
          def parts(v): return tuple(int(p) for p in v.split('.'))
          assert parts(feed_version) <= parts(version)
          PY
          grep -Fq "MINIMUM_CORE = '2.0.1'" component/admin/src/Service/CoreIntegrationService.php
          grep -Fq "MINIMUM_CORE='2.0.1'" package/script.php
          grep -Fq 'name="nationality_codes" type="Country" code="alpha3"' component/admin/forms/person.xml
          grep -Fq 'name="nationality_code" type="hidden"' component/admin/forms/person.xml
          grep -Fq 'name="additional_addresses" type="subform"' component/admin/forms/person.xml
          grep -Fq 'name="relations_data" type="subform"' component/admin/forms/person.xml
          grep -Fq 'DuplicateService' component/admin/services/provider.php
          grep -Fq 'NotificationIntegrationService' component/admin/services/provider.php
          ! grep -RniE '<targetplatform[^>]+version="(4|5|6\.0|6\.2|6\.3)' component package updates
          ! grep -RniE 'DROP[[:space:]]+TABLE|TRUNCATE[[:space:]]+TABLE' component/admin/sql
          ! grep -RniE '#__(decarocourses|decarodocuments|decaromembership|xdecarocompetitions|xdecaroorganizations)_' component
      - name: JavaScript syntax
        run: |
          node --check component/media/js/person-form.js
          node --check component/media/js/person-cancel-fix.js
      - name: Deterministic build
        shell: bash
        run: |
          set -euo pipefail
          chmod +x build/build.sh
          build/build.sh
          cp dist/SHA256SUMS.txt /tmp/people-sums
          build/build.sh
          diff -u /tmp/people-sums dist/SHA256SUMS.txt
          for zipfile in dist/*.zip; do unzip -t "$zipfile" >/dev/null; done
          VERSION="$(tr -d '\r\n' < VERSION)"
          unzip -Z1 "dist/pkg_xdecaropeople_${VERSION}.zip" | grep -Fxq 'pkg_xdecaropeople.xml'
          unzip -Z1 "dist/pkg_xdecaropeople_${VERSION}.zip" | grep -Fxq 'com_xdecaropeople.zip'

  joomla-runtime:
    runs-on: ubuntu-latest
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        mode: [clean, upgrade-1.1.0]
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
          MYSQL_DATABASE: joomla
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: 'mysqli, zip, simplexml'
          coverage: none
      - name: Build current People package
        run: chmod +x build/build.sh && build/build.sh
      - name: Build pinned Core 2.0.1 dependency
        shell: bash
        run: |
          set -euo pipefail
          CORE_SHA='423d1cb0bf0a4cedf165295e03050f5a886bbcd3'
          git clone --quiet https://github.com/xdecaro/core.git /tmp/core-src
          git -C /tmp/core-src checkout --quiet "$CORE_SHA"
          test "$(tr -d '\r\n' < /tmp/core-src/VERSION)" = '2.0.1'
          python3 /tmp/core-src/build/build.py
          cp /tmp/core-src/dist/pkg_xdecarocore_2.0.1.zip /tmp/core.zip
          unzip -t /tmp/core.zip >/dev/null
      - name: Download Joomla 6.1.3 and published upgrade baseline
        shell: bash
        run: |
          set -euo pipefail
          J='6.1.3'
          JSHA='a49305652503f9344d046d55471f324a07882996132ed967c3b0fe34707ae4a1'
          curl -fL --retry 3 "https://github.com/joomla/joomla-cms/releases/download/${J}/Joomla_${J}-Stable-Full_Package.zip" -o /tmp/joomla.zip
          echo "${JSHA}  /tmp/joomla.zip" | sha256sum --check --strict
          if [ '${{ matrix.mode }}' = 'upgrade-1.1.0' ]; then
            curl -fL --retry 3 'https://github.com/xdecaro/people/releases/download/v1.1.0/pkg_xdecaropeople_1.1.0.zip' -o /tmp/people-old.zip
            echo 'e0daaec45ba2cbf469b987760b671e464e89262c0b3c58c20b0da4ca00e1623e  /tmp/people-old.zip' | sha256sum --check --strict
          fi
          mkdir joomla
          unzip -q /tmp/joomla.zip -d joomla
      - name: Install Joomla 6.1.3 and Core
        shell: bash
        run: |
          set -euo pipefail
          cd joomla
          php installation/joomla.php install \
            --site-name='People CI' \
            --admin-user='People CI Admin' \
            --admin-username=admin \
            --admin-password="PeopleCI-${GITHUB_RUN_ID}!" \
            --admin-email=admin@example.invalid \
            --db-type=mysqli \
            --db-host=127.0.0.1 \
            --db-user=root \
            --db-pass='' \
            --db-name=joomla \
            --db-prefix=ppl_ \
            --db-encryption=0 \
            --no-interaction
          php cli/joomla.php extension:install --path=/tmp/core.zip -vvv
      - name: Prepare published People 1.1.0 upgrade state
        if: matrix.mode == 'upgrade-1.1.0'
        shell: bash
        run: |
          set -euo pipefail
          cd joomla
          php cli/joomla.php extension:install --path=/tmp/people-old.zip -vvv
          mysql --protocol=TCP -h127.0.0.1 -uroot joomla -e "DELETE FROM ppl_xdecaropeople_people; INSERT INTO ppl_xdecaropeople_people (uuid,display_name,first_name,last_name,email,phone,state,access,created,created_by) VALUES ('11111111-1111-4111-8111-111111111111','Legacy Person','Legacy','Person','legacy@example.invalid','12345',1,1,NOW(),0);"
      - name: Install current People package
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(tr -d '\r\n' < VERSION)"
          cd joomla
          php cli/joomla.php extension:install --path="$GITHUB_WORKSPACE/dist/pkg_xdecaropeople_${VERSION}.zip" -vvv
      - name: Verify installed schema and upgrade preservation
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(tr -d '\r\n' < VERSION)"
          MYSQL=(mysql --protocol=TCP -h127.0.0.1 -uroot --batch --skip-column-names joomla)
          test "$("${MYSQL[@]}" -e "SELECT COUNT(*) FROM ppl_extensions WHERE type='package' AND element='pkg_xdecaropeople';")" = 1
          test "$("${MYSQL[@]}" -e "SELECT COUNT(*) FROM ppl_extensions WHERE type='component' AND element='com_xdecaropeople' AND JSON_UNQUOTE(JSON_EXTRACT(manifest_cache,'$.version'))='${VERSION}';")" = 1
          for column in user_id birth_date sex disability_status disability_types accessibility_needs nationality_codes birth_country_code birth_place_id tax_identifier whatsapp address_line address_number postal_code city region country_code additional_addresses relations_data profile_document_uuid person_status source_component; do
            test "$("${MYSQL[@]}" -e "SELECT COUNT(*) FROM information_schema.columns WHERE table_schema='joomla' AND table_name='ppl_xdecaropeople_people' AND column_name='${column}';")" = 1
          done
          if [ '${{ matrix.mode }}' = 'upgrade-1.1.0' ]; then
            test "$("${MYSQL[@]}" -e "SELECT COUNT(*) FROM ppl_xdecaropeople_people WHERE uuid='11111111-1111-4111-8111-111111111111' AND first_name='Legacy' AND last_name='Person' AND email='legacy@example.invalid';")" = 1
          fi
      - name: Probe Joomla 6.1.3 administrator runtime
        shell: bash
        run: |
          set -euo pipefail
          cd joomla
          cat > people-runtime-probe.php <<'PHP'
          <?php
          $_SERVER['HTTP_HOST'] = 'localhost';
          define('_JEXEC', 1);
          define('JPATH_BASE', __DIR__);
          require JPATH_BASE . '/includes/defines.php';
          require JPATH_BASE . '/includes/framework.php';
          define('JPATH_COMPONENT', JPATH_ADMINISTRATOR . '/components/com_xdecaropeople');
          define('JPATH_COMPONENT_ADMINISTRATOR', JPATH_COMPONENT);

          $container = \Joomla\CMS\Factory::getContainer();
          $container->alias('session', 'session.cli')
              ->alias('JSession', 'session.cli')
              ->alias(\Joomla\CMS\Session\Session::class, 'session.cli')
              ->alias(\Joomla\Session\Session::class, 'session.cli')
              ->alias(\Joomla\Session\SessionInterface::class, 'session.cli');
          $app = $container->get('JApplicationAdministrator');
          \Joomla\CMS\Factory::$application = $app;
          $app->createExtensionNamespaceMap();

          $db = $container->get(\Joomla\Database\DatabaseInterface::class);
          $query = $db->getQuery(true)
              ->select($db->quoteName('id'))
              ->from($db->quoteName('#__users'))
              ->where($db->quoteName('username') . ' = ' . $db->quote('admin'));
          $adminId = (int) $db->setQuery($query, 0, 1)->loadResult();
          if ($adminId < 1) {
              fwrite(STDERR, "CI super user not found.\n");
              exit(1);
          }
          $userFactory = $container->get(\Joomla\CMS\User\UserFactoryInterface::class);
          $app->loadIdentity($userFactory->loadUserById($adminId));

          $component = $app->bootComponent('com_xdecaropeople');
          $factory = $component->getMVCFactory();
          $people = $factory->createModel('People', 'Administrator');
          if (!$people instanceof \xdecaro\Component\People\Administrator\Model\PeopleModel || !is_array($people->getItems())) {
              fwrite(STDERR, "PeopleModel runtime probe failed.\n");
              exit(1);
          }
          $duplicates = $factory->createModel('Duplicates', 'Administrator');
          if (!$duplicates instanceof \xdecaro\Component\People\Administrator\Model\DuplicatesModel || !is_array($duplicates->getGroups())) {
              fwrite(STDERR, "DuplicatesModel runtime probe failed.\n");
              exit(1);
          }
          if (!$component->getDuplicateService() instanceof \xdecaro\Component\People\Administrator\Service\DuplicateService) {
              fwrite(STDERR, "DuplicateService was not wired into PeopleComponent.\n");
              exit(1);
          }
          if (!$component->getNotificationIntegrationService() instanceof \xdecaro\Component\People\Administrator\Service\NotificationIntegrationService) {
              fwrite(STDERR, "NotificationIntegrationService was not wired into PeopleComponent.\n");
              exit(1);
          }
          if (version_compare($component->getCoreIntegrationService()->getVersion(), '2.0.1', '<')) {
              fwrite(STDERR, "Core 2.0.1 runtime integration unavailable.\n");
              exit(1);
          }
          echo "People Joomla 6.1.3 runtime probe OK\n";
          PHP
          php people-runtime-probe.php
