name: People CI
on:
  push: {branches: [main]}
  pull_request:
  workflow_dispatch:
permissions: {contents: read}

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with: {php-version: '8.3', coverage: none}
      - name: PHP syntax
        run: find component package tests -type f -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Validate source
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(tr -d '\r\n' < VERSION)"
          test "$VERSION" = '1.1.0'
          php tests/core-integration-smoke.php
          python3 - <<'PY'
          import json,pathlib,xml.etree.ElementTree as ET
          for p in pathlib.Path('.').rglob('*.xml'):
              ET.parse(p)
          json.load(open('component/media/joomla.asset.json', encoding='utf-8'))
          PY
          grep -Fq "<version>${VERSION}</version>" component/xdecaropeople.xml
          grep -Fq "<version>${VERSION}</version>" package/pkg_xdecaropeople.xml
          grep -Fq '"version": "1.1.0"' component/media/joomla.asset.json
          grep -Fq '<targetplatform name="joomla" version="6.*"' component/xdecaropeople.xml
          grep -Fq '<targetplatform name="joomla" version="6.*"' package/pkg_xdecaropeople.xml
          grep -Fq 'version="6\.[0-9]+"' updates/pkg_xdecaropeople.xml
          ! grep -RniE '<targetplatform[^>]+version="(4|5)' component package updates
          grep -Fq '<languages folder="admin/language">' component/xdecaropeople.xml
          grep -Fq '<folder>js</folder>' component/xdecaropeople.xml
          grep -Fq 'COM_XDECAROPEOPLE="People"' component/admin/language/it-IT/com_xdecaropeople.sys.ini
          grep -Fq 'COM_XDECAROPEOPLE="People"' component/admin/language/it-IT/com_xdecaropeople.ini
          grep -Fq 'COM_XDECAROPEOPLE_XML_DESCRIPTION=' component/admin/language/it-IT/com_xdecaropeople.sys.ini
          ! grep -Fq -- '->getApplication()' component/admin/src/Model/PeopleModel.php
          grep -Fq '$this->getUserStateFromRequest(' component/admin/src/Model/PeopleModel.php
          grep -Fq "protected \$option = 'com_xdecaropeople';" component/admin/src/Controller/PersonController.php
          grep -Fq "protected \$view_item = 'person';" component/admin/src/Controller/PersonController.php
          grep -Fq "getExtensionRecord('com_xdecaropeople', 'component', 1)" component/admin/src/Model/InformationModel.php
          ! grep -Fq "'component_version' => '1.0." component/admin/src/Model/InformationModel.php
          ! grep -RniF 'People by xdecaro' component package updates README.md AGENTS.md .github/workflows/release.yml
          grep -Fq '<name>People</name>' package/pkg_xdecaropeople.xml
          grep -Fq '<author>Luca De Caro</author>' component/xdecaropeople.xml
          grep -Fq '<author>Luca De Caro</author>' package/pkg_xdecaropeople.xml
          grep -Fq 'charset="utf8"' component/xdecaropeople.xml
          grep -Fq '<scriptfile>script.php</scriptfile>' component/xdecaropeople.xml
          grep -Fq 'final class com_xdecaropeopleInstallerScript' component/script.php
          grep -Fq 'final class pkg_xdecaropeopleInstallerScript' package/script.php
          test -f "component/admin/sql/updates/mysql/${VERSION}.sql"
          ! grep -RniE 'DROP[[:space:]]+TABLE|TRUNCATE[[:space:]]+TABLE' component/admin/sql
          ! grep -RniE '#__(decarocourses|decarodocuments|decaromembership|xdecarocompetitions|xdecaroorganizations)_' component
          ! grep -Fq 'MODIFY COLUMN `first_name`' component/admin/sql/updates/mysql/1.0.0.sql
          ! grep -Fq 'MODIFY COLUMN `last_name`' component/admin/sql/updates/mysql/1.0.0.sql
          grep -Fq "\$data['birth_date'] = \$birthDate !== '' ? \$birthDate : null;" component/admin/src/Model/PersonModel.php
          grep -Fq "'disability_status'" component/admin/src/Model/PersonModel.php
          grep -Fq 'name="nationality_code" type="Country" code="alpha3"' component/admin/forms/person.xml
          grep -Fq 'name="country_code" type="Country" code="alpha2"' component/admin/forms/person.xml
          grep -Fq 'layout="joomla.form.field.list-fancy-select"' component/admin/forms/person.xml
          ! grep -Fq 'name="display_name"' component/admin/forms/person.xml
          grep -Fq 'com_xdecaropeople.person-form' component/media/joomla.asset.json
          test -f component/media/js/person-form.js
      - name: Deterministic build
        run: |
          chmod +x build/build.sh
          build/build.sh
          cp dist/SHA256SUMS.txt /tmp/sums
          build/build.sh
          diff -u /tmp/sums dist/SHA256SUMS.txt
          for z in dist/*.zip; do unzip -t "$z" >/dev/null; done

  joomla-runtime:
    runs-on: ubuntu-latest
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        mode: ['clean','upgrade-0.2.0']
    services:
      mysql:
        image: mysql:8.0
        env: {MYSQL_ALLOW_EMPTY_PASSWORD: 'yes', MYSQL_DATABASE: joomla}
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h localhost" --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with: {php-version: '8.3', extensions: 'mysqli, zip, simplexml', coverage: none}
      - name: Build current package
        run: chmod +x build/build.sh && build/build.sh
      - name: Download verified dependencies
        shell: bash
        run: |
          set -euo pipefail
          J='6.1.3'
          JSHA='a49305652503f9344d046d55471f324a07882996132ed967c3b0fe34707ae4a1'
          curl -fL --retry 3 "https://github.com/joomla/joomla-cms/releases/download/${J}/Joomla_${J}-Stable-Full_Package.zip" -o /tmp/joomla.zip
          echo "${JSHA}  /tmp/joomla.zip" | sha256sum --check --strict
          curl -fL --retry 3 'https://github.com/xdecaro/core/releases/download/v1.4.0/pkg_xdecarocore_1.4.0.zip' -o /tmp/core.zip
          echo '4248f7e3de514c2ae2402ffc8ba12845647dca1ebac963da370650e88ac45def  /tmp/core.zip' | sha256sum --check --strict
          if [ '${{ matrix.mode }}' = 'upgrade-0.2.0' ]; then
            curl -fL --retry 3 'https://github.com/xdecaro/people/releases/download/v0.2.0/pkg_xdecaropeople_0.2.0.zip' -o /tmp/people-old.zip
            echo 'fa53fe1279106d1aa81ba26d34c006de4a31c2ace061d5a2c7c19205639f72f5  /tmp/people-old.zip' | sha256sum --check --strict
          fi
          mkdir joomla
          unzip -q /tmp/joomla.zip -d joomla
      - name: Install Joomla and Core
        shell: bash
        run: |
          set -euo pipefail
          cd joomla
          php installation/joomla.php install --site-name='People CI' --admin-user='People CI Admin' --admin-username=admin --admin-password="PeopleCI-${GITHUB_RUN_ID}!" --admin-email=admin@example.invalid --db-type=mysqli --db-host=127.0.0.1 --db-user=root --db-pass='' --db-name=joomla --db-prefix=ppl_ --db-encryption=0 --no-interaction
          php cli/joomla.php extension:install --path=/tmp/core.zip -vvv
      - name: Prepare published 0.2.0 legacy state
        if: matrix.mode == 'upgrade-0.2.0'
        shell: bash
        run: |
          set -euo pipefail
          cd joomla
          php cli/joomla.php extension:install --path=/tmp/people-old.zip -vvv
          MYSQL=(mysql --protocol=TCP -h127.0.0.1 -uroot --batch --skip-column-names joomla)
          exists="$("${MYSQL[@]}" -e "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema='joomla' AND table_name='ppl_xdecaropeople_people';")"
          if [ "$exists" = '0' ]; then
            "${MYSQL[@]}" -e "CREATE TABLE ppl_xdecaropeople_people (id int unsigned NOT NULL AUTO_INCREMENT, uuid char(36) NOT NULL, display_name varchar(255) NOT NULL, first_name varchar(150) DEFAULT NULL, last_name varchar(150) DEFAULT NULL, email varchar(254) DEFAULT NULL, phone varchar(50) DEFAULT NULL, state tinyint NOT NULL DEFAULT 1, access int unsigned NOT NULL DEFAULT 1, created datetime NOT NULL, created_by int unsigned NOT NULL DEFAULT 0, modified datetime DEFAULT NULL, modified_by int unsigned NOT NULL DEFAULT 0, PRIMARY KEY(id), UNIQUE KEY idx_uuid(uuid), KEY idx_name(last_name,first_name), KEY idx_state_access(state,access)) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4 COLLATE=utf8mb4_unicode_ci;"
          fi
          "${MYSQL[@]}" -e "DELETE FROM ppl_xdecaropeople_people; INSERT INTO ppl_xdecaropeople_people (uuid,display_name,first_name,last_name,email,state,access,created,created_by) VALUES ('11111111-1111-4111-8111-111111111111','Legacy Person',NULL,NULL,'legacy@example.invalid',1,1,NOW(),0);"
      - name: Install current People package
        shell: bash
        run: |
          set -euo pipefail
          cd joomla
          VERSION="$(tr -d '\r\n' < "$GITHUB_WORKSPACE/VERSION")"
          php cli/joomla.php extension:install --path="$GITHUB_WORKSPACE/dist/pkg_xdecaropeople_${VERSION}.zip" -vvv
      - name: Verify schema, languages and legacy preservation
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(tr -d '\r\n' < VERSION)"
          MYSQL=(mysql --protocol=TCP -h127.0.0.1 -uroot --batch --skip-column-names joomla)
          test "$("${MYSQL[@]}" -e "SELECT COUNT(*) FROM ppl_extensions WHERE type='package' AND element='pkg_xdecaropeople';")" = 1
          test "$("${MYSQL[@]}" -e "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema='joomla' AND table_name='ppl_xdecaropeople_people';")" = 1
          for column in user_id birth_date sex disability_status tax_identifier whatsapp address_line address_number language social_instagram social_facebook social_linkedin social_tiktok social_telegram social_x social_youtube website_url notes; do
            test "$("${MYSQL[@]}" -e "SELECT COUNT(*) FROM information_schema.columns WHERE table_schema='joomla' AND table_name='ppl_xdecaropeople_people' AND column_name='${column}';")" = 1
          done
          schema="$("${MYSQL[@]}" -e "SELECT s.version_id FROM ppl_schemas s JOIN ppl_extensions e ON e.extension_id=s.extension_id WHERE e.element='com_xdecaropeople' LIMIT 1;")"
          test "$schema" = "$VERSION"
          test -f joomla/administrator/language/en-GB/com_xdecaropeople.sys.ini
          grep -Fq 'COM_XDECAROPEOPLE="People"' joomla/administrator/language/en-GB/com_xdecaropeople.sys.ini
          grep -Fq 'COM_XDECAROPEOPLE_XML_DESCRIPTION=' joomla/administrator/language/en-GB/com_xdecaropeople.sys.ini
          unzip -Z1 "dist/com_xdecaropeople_${VERSION}.zip" | grep -Fxq 'admin/language/en-GB/com_xdecaropeople.sys.ini'
          unzip -Z1 "dist/com_xdecaropeople_${VERSION}.zip" | grep -Fxq 'admin/language/it-IT/com_xdecaropeople.sys.ini'
          unzip -Z1 "dist/com_xdecaropeople_${VERSION}.zip" | grep -Fxq 'media/js/person-form.js'
          grep -Fq 'COM_XDECAROPEOPLE="People"' component/admin/language/it-IT/com_xdecaropeople.sys.ini
          grep -Fq 'COM_XDECAROPEOPLE_XML_DESCRIPTION=' component/admin/language/it-IT/com_xdecaropeople.sys.ini
          if [ '${{ matrix.mode }}' = 'upgrade-0.2.0' ]; then
            test "$("${MYSQL[@]}" -e "SELECT COUNT(*) FROM ppl_xdecaropeople_people WHERE uuid='11111111-1111-4111-8111-111111111111' AND first_name IS NULL AND last_name IS NULL AND display_name='Legacy Person';")" = 1
          fi
      - name: Probe People Joomla 6 administrator runtime
        shell: bash
        run: |
          set -euo pipefail
          cd joomla
          cat > people-runtime-probe.php <<'PHP'
          <?php
          define('_JEXEC', 1);
          define('JPATH_BASE', __DIR__);
          require JPATH_BASE . '/includes/defines.php';
          require JPATH_BASE . '/includes/framework.php';
          define('JPATH_COMPONENT', JPATH_ADMINISTRATOR . '/components/com_xdecaropeople');
          define('JPATH_COMPONENT_ADMINISTRATOR', JPATH_COMPONENT);

          $container = \Joomla\CMS\Factory::getContainer();
          $container->alias('session', 'session.cli')
              ->alias('JSession', 'session.cli')
              ->alias(\Joomla\CMS\Session\Session::class, 'session.cli')
              ->alias(\Joomla\Session\Session::class, 'session.cli')
              ->alias(\Joomla\Session\SessionInterface::class, 'session.cli');
          $app = $container->get('JApplicationAdministrator');
          \Joomla\CMS\Factory::$application = $app;
          $app->createExtensionNamespaceMap();

          $component = $app->bootComponent('com_xdecaropeople');
          $factory = $component->getMVCFactory();

          $model = $factory->createModel('People', 'Administrator');
          if (!$model instanceof \xdecaro\Component\People\Administrator\Model\PeopleModel) {
              fwrite(STDERR, "PeopleModel was not created through Joomla MVCFactory.\n");
              exit(1);
          }
          $items = $model->getItems();
          if ($items === false || !is_array($items)) {
              fwrite(STDERR, "PeopleModel list query failed.\n");
              exit(1);
          }

          $person = $factory->createModel('Person', 'Administrator');
          if (!$person instanceof \xdecaro\Component\People\Administrator\Model\PersonModel) {
              fwrite(STDERR, "PersonModel was not created through Joomla MVCFactory.\n");
              exit(1);
          }

          $form = $person->getForm([], false);
          $nationality = $form ? $form->getField('nationality_code') : null;
          if (!$nationality || $nationality->type !== 'Country') {
              fwrite(STDERR, "Searchable nationality field was not loaded.\n");
              exit(1);
          }
          $optionsMethod = new \ReflectionMethod($nationality, 'getOptions');
          $optionsMethod->setAccessible(true);
          $countryOptions = (array) $optionsMethod->invoke($nationality);
          $countryValues = array_map(static fn($option): string => (string) ($option->value ?? ''), $countryOptions);
          if (!in_array('ITA', $countryValues, true) || !in_array('FRA', $countryValues, true)) {
              fwrite(STDERR, "Country field is missing expected ISO options.\n");
              exit(1);
          }

          if (!$person->save([
              'first_name' => 'Runtime',
              'last_name' => 'Probe',
              'birth_date' => '',
              'sex' => '',
              'disability_status' => '',
              'nationality_code' => 'ITA',
              'tax_identifier' => '',
              'state' => 1,
              'access' => 1,
          ])) {
              fwrite(STDERR, "Minimal person save failed: " . $person->getError() . "\n");
              exit(1);
          }

          $db = $container->get(\Joomla\Database\DatabaseInterface::class);
          $query = $db->getQuery(true)
              ->select(['id','uuid','display_name','birth_date','sex','disability_status','nationality_code'])
              ->from($db->quoteName('#__xdecaropeople_people'))
              ->where($db->quoteName('first_name') . ' = ' . $db->quote('Runtime'))
              ->where($db->quoteName('last_name') . ' = ' . $db->quote('Probe'))
              ->order($db->quoteName('id') . ' DESC');
          $saved = $db->setQuery($query, 0, 1)->loadAssoc();
          if (!$saved) {
              fwrite(STDERR, "Saved runtime person was not found.\n");
              exit(1);
          }
          if (!preg_match('/^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i', (string) $saved['uuid'])) {
              fwrite(STDERR, "Generated UUID is invalid.\n");
              exit(1);
          }
          if ($saved['display_name'] !== 'Runtime Probe' || $saved['birth_date'] !== null || $saved['sex'] !== null || $saved['disability_status'] !== null || $saved['nationality_code'] !== 'ITA') {
              fwrite(STDERR, "Minimal person normalization is incorrect: " . json_encode($saved) . "\n");
              exit(1);
          }

          $controller = $factory->createController(
              'Person',
              'Administrator',
              ['base_path' => JPATH_ADMINISTRATOR . '/components/com_xdecaropeople'],
              $app,
              $app->getInput()
          );
          if (!$controller instanceof \xdecaro\Component\People\Administrator\Controller\PersonController) {
              fwrite(STDERR, "PersonController was not created through Joomla MVCFactory.\n");
              exit(1);
          }
          $method = new \ReflectionMethod(\Joomla\CMS\MVC\Controller\FormController::class, 'getRedirectUrlToItem');
          $method->setAccessible(true);
          $url = (string) $method->invoke($controller);
          if (!str_contains($url, 'option=com_xdecaropeople') || !str_contains($url, 'view=person')) {
              fwrite(STDERR, "New-person redirect is incorrect: {$url}\n");
              exit(1);
          }

          $information = $factory->createModel('Information', 'Administrator');
          $diagnostics = $information->getDiagnostics();
          $expected = (string) getenv('PEOPLE_EXPECTED_VERSION');
          if (($diagnostics['component_version'] ?? '') !== $expected) {
              fwrite(STDERR, "Information version mismatch: expected {$expected}, got " . ($diagnostics['component_version'] ?? '') . "\n");
              exit(1);
          }

          echo "People Joomla 6 administrator runtime OK\n";
          PHP
          PEOPLE_EXPECTED_VERSION="$(tr -d '\r\n' < "$GITHUB_WORKSPACE/VERSION")" php people-runtime-probe.php
          rm people-runtime-probe.php
