name: People CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - name: PHP syntax
        run: find component package tests -type f -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Current People contracts
        shell: bash
        run: |
          set -euo pipefail
          php tests/core-integration-smoke.php
          php tests/person-validation-summary-contract.php
          php tests/person-input-ui-contract.php
          php tests/relation-reciprocity.php
          php tests/people-1.2.14-contract.php
          php tests/person-provider-batch.php
          php tests/people-1.2.15-contract.php
          php tests/person-provider-sensitive-contract.php
          php tests/people-notifications-contract.php
          php tests/people-1.2.16-contract.php
          php tests/competitions-history-tab-contract.php
          php tests/people-1.3.1-canonical-package-identity-contract.php
          php tests/organizations-history-tab-contract.php
          php tests/people-1.4.0-contract.php
          php tests/people-1.5.0-membership-contract.php
          php tests/people-1.6.0-import-contract.php
          php tests/people-1.6.1-import-review-contract.php
          php tests/people-1.7.0-duplicate-resolution-contract.php
      - name: Validate source metadata
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(tr -d '\r\n' < VERSION)"
          python3 - "$VERSION" <<'PY'
          import json, pathlib, sys, xml.etree.ElementTree as ET
          version = sys.argv[1]
          for path in pathlib.Path('.').rglob('*.xml'):
              ET.parse(path)
          component = ET.parse('component/xdecaropeople.xml').getroot()
          package = ET.parse('package/pkg_people.xml').getroot()
          feed = ET.parse('updates/pkg_people.xml').getroot().find('./update')
          assets = json.load(open('component/media/joomla.asset.json', encoding='utf-8'))
          assert component.findtext('version') == version
          assert package.findtext('version') == version
          assert package.findtext('packagename') == 'people'
          assert assets['version'] == version
          assert all(item.get('version') == version for item in assets.get('assets', []))
          assert component.find('targetplatform').attrib['version'] == '6.1.3'
          assert package.find('targetplatform').attrib['version'] == '6.1.3'
          assert feed is not None and feed.findtext('element') == 'pkg_people'
          assert feed.find('targetplatform').attrib['version'] == r'6\.1\.3$'
          assert feed.findtext('php_minimum') == '8.3.0'
          PY
          grep -Fq "MINIMUM_CORE = '2.0.1'" component/admin/src/Service/CoreIntegrationService.php
          grep -Fq "MINIMUM_CORE = '2.0.1'" package/script.php
          grep -Fq 'people.view_identity_details' component/admin/access.xml
          grep -Fq 'function searchPeopleForIdentity(' component/admin/src/Service/PersonProviderService.php
          ! grep -RniE '<targetplatform[^>]+version="(4|5|6\.0|6\.2|6\.3)' component package/pkg_people.xml updates/pkg_people.xml
          ! grep -RniE 'DROP[[:space:]]+TABLE|TRUNCATE[[:space:]]+TABLE' component/admin/sql
          ! grep -RniE '#__(decarocourses|decarodocuments|decaromembership|xdecarocompetitions|xdecaroorganizations)_' component
      - name: JavaScript syntax
        run: |
          node --check component/media/js/person-form.js
          node --check component/media/js/person-cancel-fix.js
          node --check component/media/js/import.js
      - name: Deterministic build
        shell: bash
        run: |
          set -euo pipefail
          chmod +x build/build.sh
          build/build.sh
          cp dist/SHA256SUMS.txt /tmp/people-sums
          build/build.sh
          diff -u /tmp/people-sums dist/SHA256SUMS.txt
          for zipfile in dist/*.zip; do unzip -t "$zipfile" >/dev/null; done
          VERSION="$(tr -d '\r\n' < VERSION)"
          unzip -Z1 "dist/pkg_people_${VERSION}.zip" | grep -Fxq 'pkg_people.xml'
          unzip -Z1 "dist/pkg_people_${VERSION}.zip" | grep -Fxq 'com_xdecaropeople.zip'
          unzip -p "dist/pkg_people_${VERSION}.zip" com_xdecaropeople.zip > /tmp/component.zip
          unzip -p /tmp/component.zip admin/src/Service/ImportService.php | grep -Fq 'function importBatch'
          unzip -p /tmp/component.zip admin/src/Service/DuplicateService.php | grep -Fq 'function mergeGroup'
          unzip -p /tmp/component.zip admin/src/Controller/DuplicateController.php | grep -Fq 'function dismiss'
          unzip -p /tmp/component.zip admin/src/Service/PersonProviderService.php | grep -Fq 'resolveCanonicalUuid'
          unzip -Z1 /tmp/component.zip | grep -Fxq 'admin/sql/updates/mysql/1.7.0.sql'
          unzip -Z1 /tmp/component.zip | grep -Fxq 'media/js/import.js'

  joomla-runtime:
    runs-on: ubuntu-latest
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        mode: [clean, upgrade-1.1.0, upgrade-1.3.0]
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
          MYSQL_DATABASE: joomla
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: 'mysqli, zip, simplexml'
          coverage: none
      - name: Build current People package
        run: chmod +x build/build.sh && build/build.sh
      - name: Build pinned Core 2.0.1 dependency
        shell: bash
        run: |
          set -euo pipefail
          CORE_SHA='423d1cb0bf0a4cedf165295e03050f5a886bbcd3'
          git clone --quiet https://github.com/xdecaro/core.git /tmp/core-src
          git -C /tmp/core-src checkout --quiet "$CORE_SHA"
          test "$(tr -d '\r\n' < /tmp/core-src/VERSION)" = '2.0.1'
          python3 /tmp/core-src/build/build.py
          cp /tmp/core-src/dist/pkg_xdecarocore_2.0.1.zip /tmp/core.zip
          unzip -t /tmp/core.zip >/dev/null
      - name: Download Joomla and upgrade baseline
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 'https://github.com/joomla/joomla-cms/releases/download/6.1.3/Joomla_6.1.3-Stable-Full_Package.zip' -o /tmp/joomla.zip
          echo 'a49305652503f9344d046d55471f324a07882996132ed967c3b0fe34707ae4a1  /tmp/joomla.zip' | sha256sum --check --strict
          case '${{ matrix.mode }}' in
            upgrade-1.1.0)
              curl -fL --retry 3 'https://github.com/xdecaro/people/releases/download/v1.1.0/pkg_xdecaropeople_1.1.0.zip' -o /tmp/people-old.zip
              echo 'e0daaec45ba2cbf469b987760b671e464e89262c0b3c58c20b0da4ca00e1623e  /tmp/people-old.zip' | sha256sum --check --strict ;;
            upgrade-1.3.0)
              curl -fL --retry 3 'https://github.com/xdecaro/people/releases/download/v1.3.0/pkg_xdecaropeople_1.3.0.zip' -o /tmp/people-old.zip
              echo '9155621f88cbfa13669fe579532a0437da2e03c58c51583f0f8da34416ed0489  /tmp/people-old.zip' | sha256sum --check --strict ;;
          esac
          mkdir joomla
          unzip -q /tmp/joomla.zip -d joomla
      - name: Install Joomla and Core
        shell: bash
        run: |
          set -euo pipefail
          cd joomla
          php installation/joomla.php install --site-name='People CI' --admin-user='People CI Admin' --admin-username=admin --admin-password="PeopleCI-${GITHUB_RUN_ID}!" --admin-email=admin@example.invalid --db-type=mysqli --db-host=127.0.0.1 --db-user=root --db-pass='' --db-name=joomla --db-prefix=ppl_ --db-encryption=0 --no-interaction
          php cli/joomla.php extension:install --path=/tmp/core.zip -vvv
      - name: Prepare legacy People upgrade state
        if: matrix.mode != 'clean'
        shell: bash
        run: |
          set -euo pipefail
          cd joomla
          php cli/joomla.php extension:install --path=/tmp/people-old.zip -vvv
          mysql --protocol=TCP -h127.0.0.1 -uroot joomla -e "DELETE FROM ppl_xdecaropeople_people; INSERT INTO ppl_xdecaropeople_people (uuid,display_name,first_name,last_name,email,phone,state,access,created,created_by) VALUES ('11111111-1111-4111-8111-111111111111','Legacy Person','Legacy','Person','legacy@example.invalid','12345',1,1,NOW(),0);"
          test "$(mysql --protocol=TCP -h127.0.0.1 -uroot --batch --skip-column-names joomla -e "SELECT COUNT(*) FROM ppl_extensions WHERE type='package' AND element='pkg_xdecaropeople';")" = 1
      - name: Install current canonical People package
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(tr -d '\r\n' < VERSION)"
          cd joomla
          php cli/joomla.php extension:install --path="$GITHUB_WORKSPACE/dist/pkg_people_${VERSION}.zip" -vvv
      - name: Verify schema, ownership and upgrade preservation
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(tr -d '\r\n' < VERSION)"
          MYSQL=(mysql --protocol=TCP -h127.0.0.1 -uroot --batch --skip-column-names joomla)
          test "$("${MYSQL[@]}" -e "SELECT COUNT(*) FROM ppl_extensions WHERE type='package' AND element='pkg_people';")" = 1
          test "$("${MYSQL[@]}" -e "SELECT COUNT(*) FROM ppl_extensions WHERE type='package' AND element='pkg_xdecaropeople';")" = 0
          PACKAGE_ID="$("${MYSQL[@]}" -e "SELECT extension_id FROM ppl_extensions WHERE type='package' AND element='pkg_people' LIMIT 1;")"
          test -n "$PACKAGE_ID"
          test "$("${MYSQL[@]}" -e "SELECT COUNT(*) FROM ppl_extensions WHERE type='component' AND element='com_xdecaropeople' AND package_id=${PACKAGE_ID} AND JSON_UNQUOTE(JSON_EXTRACT(manifest_cache,'$.version'))='${VERSION}';")" = 1
          for column in user_id birth_date sex disability_status disability_types accessibility_needs nationality_codes birth_country_code birth_place_id tax_identifier whatsapp address_line address_number postal_code city region country_code additional_addresses relations_data profile_document_uuid person_status source_component; do
            test "$("${MYSQL[@]}" -e "SELECT COUNT(*) FROM information_schema.columns WHERE table_schema='joomla' AND table_name='ppl_xdecaropeople_people' AND column_name='${column}';")" = 1
          done
          test "$("${MYSQL[@]}" -e "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema='joomla' AND table_name='ppl_xdecaropeople_duplicate_ignores';")" = 1
          test "$("${MYSQL[@]}" -e "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema='joomla' AND table_name='ppl_xdecaropeople_merges';")" = 1
          if [ '${{ matrix.mode }}' != 'clean' ]; then
            test "$("${MYSQL[@]}" -e "SELECT COUNT(*) FROM ppl_xdecaropeople_people WHERE uuid='11111111-1111-4111-8111-111111111111' AND first_name='Legacy' AND last_name='Person' AND email='legacy@example.invalid';")" = 1
          fi
      - name: Probe People runtime
        shell: bash
        run: |
          set -euo pipefail
          cd joomla
          cat > people-runtime-probe.php <<'PHP'
          <?php
          $_SERVER['HTTP_HOST'] = 'localhost';
          define('_JEXEC', 1); define('JPATH_BASE', __DIR__);
          require JPATH_BASE . '/includes/defines.php'; require JPATH_BASE . '/includes/framework.php';
          define('JPATH_COMPONENT', JPATH_ADMINISTRATOR . '/components/com_xdecaropeople'); define('JPATH_COMPONENT_ADMINISTRATOR', JPATH_COMPONENT);
          $container = \Joomla\CMS\Factory::getContainer();
          $container->alias('session','session.cli')->alias('JSession','session.cli')->alias(\Joomla\CMS\Session\Session::class,'session.cli')->alias(\Joomla\Session\Session::class,'session.cli')->alias(\Joomla\Session\SessionInterface::class,'session.cli');
          $app = $container->get('JApplicationAdministrator'); \Joomla\CMS\Factory::$application = $app; $app->createExtensionNamespaceMap();
          $db = $container->get(\Joomla\Database\DatabaseInterface::class);
          $q=$db->getQuery(true)->select('id')->from('#__users')->where($db->quoteName('username').'='.$db->quote('admin'));
          $id=(int)$db->setQuery($q,0,1)->loadResult(); $app->loadIdentity($container->get(\Joomla\CMS\User\UserFactoryInterface::class)->loadUserById($id));
          $component=$app->bootComponent('com_xdecaropeople');
          if (!$component->getPersonProviderService() instanceof \xdecaro\Component\People\Administrator\Service\PersonProviderService) exit(1);
          if (!method_exists($component->getPersonProviderService(), 'searchPeopleForIdentity')) exit(1);
          $importer=$component->getImportService();
          if (!$importer instanceof \xdecaro\Component\People\Administrator\Service\ImportService) exit(1);
          $importRow=[[
            '_row'=>2,
            'first_name'=>'CI',
            'last_name'=>'Import',
            'tax_identifier'=>'CIIMPORT00000001',
            'birth_date'=>'2000-01-02',
            'sex'=>'M',
            'birth_place'=>'Roma',
            'birth_region'=>'RM',
            'address_line'=>'Via Test',
            'address_number'=>'1',
            'postal_code'=>'00100',
            'city'=>'Roma',
            'region'=>'RM',
            'phone'=>'+3906123456',
            'email'=>'ci-import@example.invalid',
          ]];
          $first=$importer->importBatch($importRow,$id,'ens_soci_2026');
          if (($first['inserted'] ?? 0)!==1 || ($first['errors'] ?? 0)!==0) { var_export($first); exit(1); }
          $second=$importer->importBatch($importRow,$id,'ens_soci_2026');
          if (($second['existing'] ?? 0)!==1 || ($second['inserted'] ?? 0)!==0) { var_export($second); exit(1); }
          $q=$db->getQuery(true)->select('COUNT(*)')->from('#__xdecaropeople_people')->where($db->quoteName('tax_identifier').'='.$db->quote('CIIMPORT00000001'))->where($db->quoteName('source_component').'='.$db->quote('com_xdecaropeople.import'));
          if ((int)$db->setQuery($q)->loadResult()!==1) exit(1);
          $q=$db->getQuery(true)->select('COUNT(*)')->from($db->quoteName('#__xdecaropeople_history','h'))->join('INNER',$db->quoteName('#__xdecaropeople_people','p').' ON '.$db->quoteName('p.id').'='.$db->quoteName('h.person_id'))->where($db->quoteName('p.tax_identifier').'='.$db->quote('CIIMPORT00000001'))->where($db->quoteName('h.action').'='.$db->quote('import'));
          if ((int)$db->setQuery($q)->loadResult()!==1) exit(1);
          echo "People runtime and CSV import OK\n";
          PHP
          php people-runtime-probe.php
