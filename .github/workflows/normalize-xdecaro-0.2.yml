name: Normalize People 0.2.0 Identity

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/normalize-xdecaro-0.2.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: normalize-xdecaro-0.2.0
          fetch-depth: 0
      - name: Normalize source identity
        run: python3 tools/normalize_identity.py
      - name: Validate transformed source
        run: |
          set -euo pipefail
          find component package -name '*.php' -print0 | xargs -0 -n1 php -l
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          for path in Path('.').rglob('*.xml'):
              if '.git' not in path.parts and '.github' not in path.parts:
                  ET.parse(path)
          PY
          test "$(cat VERSION)" = '0.2.0'
          test -f component/xdecaropeople.xml
          test -f package/pkg_xdecaropeople.xml
          grep -Fq 'Xdecaro\Component\People' component/xdecaropeople.xml
          grep -Fq '#__xdecaropeople_' component/admin/sql/install.mysql.utf8mb4.sql
      - name: Commit transformed branch
        run: |
          set -euo pipefail
          rm tools/normalize_identity.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Normalize People 0.2.0 to xdecaro identity'
          git push origin HEAD:normalize-xdecaro-0.2.0
