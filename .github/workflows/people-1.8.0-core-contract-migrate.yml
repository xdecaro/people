name: People 1.8.0 Core contract migration

on:
  push:
    branches:
      - feat/people-1.8.0-core-admin-ui
    paths:
      - .github/workflows/people-1.8.0-core-contract-migrate.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/people-1.8.0-core-admin-ui
      - name: Align legacy Core integration smoke contract
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tests/core-integration-smoke.php')
          s = p.read_text()
          s = s.replace("MINIMUM_CORE = '2.0.1'", "MINIMUM_CORE = '2.2.0'")
          s = s.replace('People package must require Core 2.0.1 or later.', 'People package must require Core 2.2.0 or later.')
          s = s.replace("'class=\"form-validate\"'", "'class=\"form-validate xdecaro-form\"'")
          p.write_text(s)
          PY
      - name: Commit contract migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/core-integration-smoke.php
          git diff --cached --quiet && exit 0
          git commit -m "test: align People Core integration smoke with 2.2.0"
          git push origin HEAD:feat/people-1.8.0-core-admin-ui
