name: People 1.7.33 person accordion and timezone

on:
  pull_request:
  push:
    branches:
      - people-1.7.33-person-accordion-timezone

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - name: People 1.7.33 contracts
        run: |
          set -euo pipefail
          php tests/people-1.7.33-person-accordion-timezone-contract.php
          php tests/people-1.7.33-release-readiness-contract.php
